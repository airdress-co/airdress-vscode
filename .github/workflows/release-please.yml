# Maintains a running release PR (version bump + CHANGELOG) from
# conventional commits. Merging that PR — a deliberate human act — creates
# the tag and the GitHub Release. Publishing to the registries stays a
# separate, approval-gated workflow_dispatch of release.yml.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
